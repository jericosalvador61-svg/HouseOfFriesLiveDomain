<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>House of Fries - Your Cart</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary-yellow: #FFB800;
            --dark-bg: #121212;
            --card-bg: #FFFFFF;
            --text-main: #331A11;
            --price-green: #008444;
            --delete-red: #FF3B30;
            --border-color: #E5E5EA;
            --light-gray: #F2F2F7;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #FAF9F6;
            padding-top: 90px;
            /* Space for sticky header */
            padding-bottom: 120px;
            /* Aligned with Menu page */
            min-height: 100vh;
        }

        /* --- MATCHING STICKY TOP NAVBAR --- */
        header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background-color: var(--dark-bg);
            padding: 14px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: nowrap;
            z-index: 1050;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
        }

        .brand-container {
            display: flex;
            flex-direction: column;
        }

        .brand-logo {
            height: 40px;
            width: auto;
            object-fit: contain;
            display: block;
            flex-shrink: 0;
        }

        header h1 {
            color: var(--primary-yellow);
            font-size: 22px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        header p {
            color: rgba(255, 255, 255, 0.6);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
            margin-top: 1px;
        }

        /* --- UPPER-RIGHT BACK NAVIGATION TRIGGER --- */
        .back-nav-trigger {
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid transparent;
            width: 48px;
            height: 48px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            color: var(--primary-yellow);
            text-decoration: none;
        }

        .back-nav-trigger:hover,
        .back-nav-trigger:focus {
            background: rgba(255, 255, 255, 0.18);
            border-color: var(--primary-yellow);
            outline: none;
        }

        .back-nav-trigger i {
            font-size: 18px;
        }

        .cart-nav-trigger {
            position: relative;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid transparent;
            width: 48px;
            height: 48px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .cart-nav-trigger:hover,
        .cart-nav-trigger:focus {
            background: rgba(255, 255, 255, 0.18);
            border-color: var(--primary-yellow);
            outline: none;
        }
        .cart-nav-trigger i {
            color: var(--primary-yellow);
            font-size: 20px;
        }
        .nav-badge {
            position: absolute;
            top: -5px;
            right: -5px;
            background: #FF3B30;
            color: white;
            font-size: 11px;
            font-weight: 700;
            min-width: 20px;
            height: 20px;
            border-radius: 10px;
            padding: 0 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid var(--dark-bg);
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
        }

        /* Table Banner Segment */
        .order-status {
            text-align: center;
            margin: 20px auto;
            max-width: fit-content;
            font-weight: 700;
            color: white;
            background: var(--text-main);
            font-size: 13px;
            padding: 6px 18px;
            border-radius: 50px;
            box-shadow: 0 4px 10px rgba(51, 26, 17, 0.1);
            /* REQ-054 B1: prevent overflow with long takeout customer names */
            max-width: calc(100% - 40px);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .view-title {
            text-align: left;
            font-weight: 800;
            font-size: 22px;
            margin: 20px auto 10px auto;
            max-width: 600px;
            padding: 0 20px;
            color: var(--text-main);
        }

        /* --- 📱 TOUCH SWIPE INFRASTRUCTURE LAYOUT --- */
        .cart-container {
            padding: 0 20px;
            max-width: 600px;
            margin: 0 auto;
        }

        .swipe-item-wrapper {
            position: relative;
            width: 100%;
            margin-bottom: 14px;
            border-radius: 16px;
            overflow: hidden;
            background-color: var(--delete-red);
        }

        .swipe-delete-action {
            position: absolute;
            top: 0;
            right: 0;
            height: 100%;
            width: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 20px;
            cursor: pointer;
            z-index: 1;
        }

        .cart-item-content {
            position: relative;
            display: flex;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            min-height: 100px;
            z-index: 2;
            transition: transform 0.25s cubic-bezier(0.25, 1, 0.5, 1);
            will-change: transform;
            touch-action: pan-y;
        }

        .cart-item-content.swiped {
            transform: translateX(-80px);
        }

        .cart-item-content img {
            width: 100px;
            height: 100px;
            object-fit: cover;
            border-top-left-radius: 15px;
            border-bottom-left-radius: 15px;
            background-color: var(--light-gray);
            flex-shrink: 0;
        }

        .item-details {
            flex: 1;
            padding: 12px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-width: 0;
        }

        .item-details h3 {
            font-size: 15px;
            font-weight: 700;
            color: var(--text-main);
            line-height: 1.2;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .item-details p {
                    font-size: 11px;
                    color: #75757a;
                    margin-top: 2px;
                }

                .special-instructions-input {
                    font-size: 11px;
                    color: #555;
                    background: #fafafa;
                    border: 1px solid #e0e0e0;
                    border-radius: 8px;
                    padding: 6px 10px;
                    margin-top: 6px;
                    width: 100%;
                    font-family: inherit;
                    resize: none;
                    min-height: 36px;
                    max-height: 80px;
                    box-sizing: border-box;
                    outline: none;
                }

                .special-instructions-input:focus {
                    border-color: #FFB800;
                    background: #fff;
                }

                /* --- Compact "+ Add Instruction" control --- */
                .instr-wrap {
                    margin-top: 6px;
                    font-size: 11px;
                }

                .instr-add-btn {
                    display: inline-flex;
                    align-items: center;
                    gap: 4px;
                    background: #fff8e6;
                    color: #8a6d00;
                    border: 1px dashed #e0b400;
                    border-radius: 8px;
                    padding: 5px 10px;
                    font-size: 11px;
                    font-weight: 700;
                    cursor: pointer;
                }

                .instr-add-btn:active {
                    transform: scale(0.97);
                }

                .instr-view .instr-saved {
                    background: #fafafa;
                    border: 1px solid #e0e0e0;
                    border-radius: 8px;
                    padding: 6px 10px;
                    color: #333;
                    line-height: 1.4;
                    overflow-wrap: anywhere;
                }

                /* REQ-054 B1: red tag for carted lines whose menu item is unavailable */
                .unavailable-tag {
                    display: inline-block;
                    margin-top: 6px;
                    padding: 3px 10px;
                    background: #dc3545;
                    color: #fff;
                    font-size: 11px;
                    font-weight: 800;
                    text-transform: uppercase;
                    letter-spacing: 0.5px;
                    border-radius: 8px;
                }

                .instr-actions {
                    display: flex;
                    gap: 6px;
                    margin-top: 6px;
                }

                .instr-btn {
                    background: #f1f1f4;
                    border: 1px solid #d9d9de;
                    border-radius: 8px;
                    padding: 5px 12px;
                    font-size: 11px;
                    font-weight: 700;
                    color: #331A11;
                    cursor: pointer;
                }

                .instr-btn-primary {
                    background: #FFB800;
                    border-color: #FFB800;
                    color: #331A11;
                }

                .instr-btn-danger {
                    background: #fff;
                    color: #c62828;
                    border-color: #ef9a9a;
                }

                .instr-editor .special-instructions-input {
                    margin-top: 6px;
                }

                .special-instructions-input::placeholder {
                    color: #aaa;
                }

                .item-price-tag {
            color: var(--price-green);
            font-weight: 700;
            font-size: 15px;
            margin-top: 4px;
        }

        .cart-controls {
            display: flex;
            align-items: center;
            background: var(--light-gray);
            border-radius: 12px;
            margin: 0 12px;
            height: 36px;
            align-self: center;
            overflow: hidden;
            border: 1px solid var(--border-color);
            flex-shrink: 0;
        }

        .btn-ctrl {
            width: 36px;
            height: 100%;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            background: transparent;
            color: var(--text-main);
            transition: background-color 0.2s;
        }

        .btn-ctrl:active {
            background-color: rgba(0, 0, 0, 0.08);
        }

        .qty-label {
            font-size: 14px;
            font-weight: 700;
            min-width: 28px;
            text-align: center;
            color: var(--text-main);
        }

        /* --- Payment Section --- */
        .payment-section {
            padding: 0 20px;
            max-width: 600px;
            margin: 25px auto 30px auto;
        }

        .payment-section h3 {
            font-size: 13px;
            color: var(--text-main);
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 700;
        }

        .payment-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .payment-card {
            cursor: pointer;
        }

        .payment-card input {
            display: none;
        }

        .card-content {
            background: white;
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 16px 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.02);
            transition: all 0.2s ease;
        }

        .card-content i {
            font-size: 24px;
            color: #8E8E93;
        }

        .card-content span {
            font-size: 13px;
            font-weight: 600;
            color: #8E8E93;
        }

        .payment-card input:checked+.card-content {
            border-color: var(--primary-yellow);
            background-color: #FFFDF5;
            box-shadow: 0 4px 12px rgba(255, 184, 0, 0.15);
        }

        .payment-card input:checked+.card-content i,
        .payment-card input:checked+.card-content span {
            color: var(--text-main);
        }

        /* --- Optimized Bottom Sticky Utilities --- */
        .checkout-bar {
            position: fixed;
            bottom: 24px;
            left: 20px;
            right: 20px;
            background: rgba(18, 18, 18, 0.96);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 24px;
            color: white;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.35);
            z-index: 1000;
            max-width: 560px;
            margin: 0 auto;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .total-info {
            display: flex;
            flex-direction: column;
        }

        .total-info div {
            font-size: 11px;
            opacity: 0.7;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 500;
        }

        .total-info span#cartViewTotalAmount {
            font-size: 22px;
            font-weight: 800;
            color: var(--primary-yellow);
            margin-top: 2px;
        }

        .checkout-btn {
            background: var(--primary-yellow);
            color: var(--dark-bg);
            border: none;
            padding: 14px 28px;
            border-radius: 16px;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(255, 184, 0, 0.2);
            transition: all 0.2s ease;
        }

        .checkout-btn:active {
            transform: scale(0.98);
        }

        /* --- Media Queries for Responsive Handling --- */
        @media (max-width: 640px) {
            body {
                padding-top: 80px;
                padding-bottom: 110px;
            }

            header {
                padding: 12px 16px;
            }

            header h1 {
                font-size: 18px;
            }

            .brand-logo { height: 34px; }
            .back-nav-trigger { width: 42px; height: 42px; }
            .cart-nav-trigger { width: 42px; height: 42px; }

            .view-title {
                margin: 15px 0 10px 0;
                padding: 0 20px;
                font-size: 20px;
            }

            .checkout-bar {
                left: 12px;
                right: 12px;
                bottom: 16px;
                padding: 12px 18px;
            }
        }

        /* --- GCash Full Screen Sandbox View Overlay --- */
        .gcash-sandbox-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #E7EEFF;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            flex-direction: column;
            z-index: 2000;
            box-shadow: -5px 0 15px rgba(0, 0, 0, 0.2);
            transform: translateX(100%);
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .gcash-sandbox-container.show {
            transform: translateX(0);
        }
    </style>
    <script src="/javascript/loading.js"></script>
    </head>

<body>

    <!-- STICKY TOP NAVIGATION BAR -->
    <header>
        <img src="../images/Logo.png" alt="House of Fries" class="brand-logo">

        <!-- UPPER RIGHT BACK BUTTON -->
        <a class="back-nav-trigger" href="customer.html" aria-label="Back to Menu">
            <i class="fa-solid fa-arrow-left"></i>
        </a>
        <div style="display:flex;align-items:center;gap:8px;flex-shrink:0;">
            <div id="hofCustomerAccountChip"></div>
            <button class="cart-nav-trigger" id="cartTrigger" aria-label="View Shopping Cart" onclick="window.location.href='cart.html'">
                <i class="fa-solid fa-cart-shopping"></i>
                <div class="nav-badge" id="cartBadgeCount">0</div>
            </button>
            <button class="cart-nav-trigger" id="myOrdersBtn" aria-label="My Orders" onclick="window.location.href='orderHistory.html'">
                <i class="fa-solid fa-receipt"></i>
                <div class="nav-badge" id="myOrdersBadge" style="display:none;">0</div>
            </button>
        </div>
    </header>

    <div id="tableDisplay" class="order-status">Ordering for Table ... / Dine - In</div>

    <div class="view-title">Your Cart</div>

    <div class="cart-container" id="cartItemsList">
    </div>

    <div class="payment-section">
        <h3>Payment Method</h3>
        <div class="payment-options">
            <label class="payment-card">
                <input type="radio" name="payment_method" value="CASH">
                <div class="card-content">
                    <i class="fa-solid fa-money-bill-wave"></i>
                    <span>Cash</span>
                </div>
            </label>

            <label class="payment-card">
                <input type="radio" name="payment_method" value="GCASH">
                <div class="card-content">
                    <i class="fa-solid fa-mobile-screen-button"></i>
                    <span>GCash</span>
                </div>
            </label>
        </div>
    </div>

    <div class="checkout-bar">
        <div class="total-info">
            <div>Total Items: <span id="cartViewTotalCount" style="font-weight:700; color:white;">0</span></div>
            <span id="cartViewTotalAmount">₱ 0.00</span>
        </div>
        <button class="checkout-btn" id="placeOrderBtn">Proceed to Payment</button>
    </div>

    <div id="gcashSandboxScreen" class="gcash-sandbox-container">
        <header
            style="background: #0056E3; color: white; display: flex; align-items: center; justify-content: space-between; padding: 15px 20px; border-radius:0;">
            <a href="#" onclick="hideGcashSandbox()" style="color: white; font-size: 20px;"><i
                    class="fa-solid fa-xmark"></i></a>
            <span style="font-weight: bold;">Express Send</span>
            <div style="opacity: 0;">7:03 <i class="fa-solid fa-battery-full"></i></div>
        </header>

        <div
            style="flex: 1; padding: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px;">
            <span class="big-total" style="color: #0056E3; font-size: 36px; font-weight: 800;">₱<span
                    id="gcashSandboxTotal">0.00</span></span>
            <button class="btn-send-main"
                style="background: #0056E3; color: white; width: 100%; max-width: 360px; padding: 18px; border-radius: 30px; font-size: 16px; font-weight: bold; border: none; box-shadow: 0 4px 12px rgba(0,86,227,0.25);"
                id="sandboxConfirmPayBtn">Send Payment</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
        <script src="https://js.pusher.com/8.0/pusher.min.js"></script>
        <script src="device.js"></script>
        <script src="account.js"></script>
        <script src="my_orders.js"></script>
        <script src="/javascript/menu-choice-popup.js" defer></script>
        <script src="cart.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('cartItemsList');
            let startX = 0;
            let startY = 0;
            let activeCard = null;
            let isSwiping = false;

            container.addEventListener('touchstart', (e) => {
                const card = e.target.closest('.cart-item-content');
                if (!card) return;

                if (activeCard && activeCard !== card) {
                    activeCard.classList.remove('swiped');
                    activeCard = null;
                }

                startX = e.touches[0].clientX;
                startY = e.touches[0].clientY;
                isSwiping = true;
            }, { passive: true });

            container.addEventListener('touchmove', (e) => {
                if (!isSwiping) return;

                const card = e.target.closest('.cart-item-content');
                if (!card) return;

                const currentX = e.touches[0].clientX;
                const currentY = e.touches[0].clientY;

                const diffX = startX - currentX;
                const diffY = Math.abs(startY - currentY);

                if (diffY > 10 && !card.classList.contains('swiped')) {
                    isSwiping = false;
                    return;
                }

                if (diffX > 45) {
                    card.classList.add('swiped');
                    activeCard = card;
                    isSwiping = false;
                } else if (diffX < -45) {
                    card.classList.remove('swiped');
                    if (activeCard === card) activeCard = null;
                    isSwiping = false;
                }
            }, { passive: true });

            container.addEventListener('touchend', () => {
                isSwiping = false;
            });
        });
    </script>
</body>

</html>
