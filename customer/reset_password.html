<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - House of Fries</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        :root {
            --primary-yellow: #FFB800;
            --dark-bg: #121212;
            --card-bg: #FFFFFF;
            --text-main: #331A11;
            --border-color: #E5E5EA;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
        body {
            background-color: #FAF9F6;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .reset-card {
            background: var(--card-bg);
            width: 100%;
            max-width: 420px;
            padding: 30px 24px;
            border-radius: 24px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.05);
            border: 1px solid var(--border-color);
        }
        .reset-card h2 { font-size: 22px; font-weight: 800; margin-bottom: 6px; }
        .reset-card p { font-size: 13px; color: #666; margin-bottom: 18px; line-height: 1.5; }
        .field { margin-bottom: 14px; text-align: left; }
        .field label { display: block; font-size: 12px; font-weight: 700; color: var(--text-main); margin-bottom: 5px; }
        .field input {
            width: 100%; padding: 12px 14px; border: 1px solid var(--border-color);
            border-radius: 12px; font-size: 14px; outline: none; box-sizing: border-box;
        }
        .field input:focus { border-color: var(--primary-yellow); }
        .btn-submit {
            width: 100%; padding: 14px; border: none; border-radius: 12px;
            background: var(--primary-yellow); color: #1e1e1e; font-weight: 800; font-size: 15px;
            cursor: pointer; margin-top: 6px;
        }
        .btn-submit:active { transform: scale(0.98); }
        .hint { font-size: 11px; color: #999; margin-top: 4px; line-height: 1.4; }
        .back-link { display: block; text-align: center; margin-top: 16px; font-size: 13px; font-weight: 700; color: #0056E3; text-decoration: none; }
        .back-link:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="reset-card">
        <h2>Reset Password</h2>
        <p>Enter the reset code provided by our staff along with your new password.</p>
        <form id="resetForm" novalidate>
            <div class="field">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" placeholder="09171234567" autocomplete="off">
            </div>
            <div class="field">
                <label for="tempCode">Reset Code</label>
                <input type="text" id="tempCode" placeholder="8-character code from staff" autocomplete="off" maxlength="8" style="font-family:monospace;letter-spacing:2px;text-transform:uppercase;">
                <div class="hint">Ask our staff to generate a reset code for your phone number. It expires in 15 minutes.</div>
            </div>
            <div class="field">
                <label for="newPassword">New Password</label>
                <input type="password" id="newPassword" placeholder="At least 6 characters">
                <div class="hint">Must contain an uppercase letter, a number, and a special character.</div>
            </div>
            <div class="field">
                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword" placeholder="Retype your new password">
            </div>
            <button type="submit" class="btn-submit" id="resetBtn">Reset Password</button>
        </form>
        <a href="orderHistory.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Back to My Orders</a>
    </div>

    <script src="reset_password.js"></script>
</body>
</html>
