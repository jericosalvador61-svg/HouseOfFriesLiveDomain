<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>My Orders - House of Fries</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="/javascript/loading.js"></script>
    <style>
        :root {
            --primary-yellow: #FFB800;
            --dark-bg: #121212;
            --card-bg: #FFFFFF;
            --text-main: #331A11;
            --border-color: #E5E5EA;
            --light-gray: #F2F2F7;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #FAF9F6; color: var(--text-main); padding-top: 90px; padding-bottom: 40px; min-height: 100vh; }
        header {
            position: fixed; top: 0; left: 0; right: 0;
            background-color: var(--dark-bg); padding: 14px 24px;
            display: flex; align-items: center; justify-content: space-between;
            flex-wrap: nowrap; z-index: 1050; box-shadow: 0 4px 20px rgba(0,0,0,0.15);
        }
        header h1 { color: var(--primary-yellow); font-size: 20px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.5px; }
        .brand-logo { height: 40px; width: auto; object-fit: contain; display: block; flex-shrink: 0; }
        .back-nav-trigger {
            background: rgba(255,255,255,0.1); border: 2px solid transparent;
            width: 48px; height: 48px; border-radius: 14px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: all 0.2s ease; color: var(--primary-yellow); text-decoration: none;
        }
        .back-nav-trigger:hover, .back-nav-trigger:focus { background: rgba(255,255,255,0.18); border-color: var(--primary-yellow); outline: none; }
        .back-nav-trigger i { font-size: 18px; }
        .cart-nav-trigger {
            position: relative; background: rgba(255,255,255,0.1);
            border: 2px solid transparent; width: 48px; height: 48px; border-radius: 14px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: all 0.2s ease;
        }
        .cart-nav-trigger:hover, .cart-nav-trigger:focus { background: rgba(255,255,255,0.18); border-color: var(--primary-yellow); outline: none; }
        .cart-nav-trigger i { color: var(--primary-yellow); font-size: 20px; }
        .nav-badge {
            position: absolute; top: -5px; right: -5px; background: #FF3B30; color: white;
            font-size: 11px; font-weight: 700; min-width: 20px; height: 20px;
            border-radius: 10px; padding: 0 5px; display: flex; align-items: center; justify-content: center;
            border: 2px solid var(--dark-bg); box-shadow: 0 2px 6px rgba(0,0,0,0.3);
        }
        .page { max-width: 600px; margin: 0 auto; padding: 0 16px; }
        .section-title { font-size: 18px; font-weight: 800; margin-bottom: 12px; color: var(--text-main); }
        .filter-row { display: flex; gap: 8px; margin-bottom: 16px; justify-content: center; }
        .chip {
            padding: 8px 20px; border-radius: 20px; font-size: 13px; font-weight: 600;
            cursor: pointer; transition: all 0.2s; border: none; min-height: 44px;
        }
        .chip-active { background: var(--primary-yellow); color: #1e1e1e; }
        .chip-inactive { background: #f0f0f0; color: #666; }
        .order-card {
            background: var(--card-bg); border-radius: 16px; padding: 16px;
            margin-bottom: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            border: 1px solid var(--border-color);
        }
        .order-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
        .order-ref { font-weight: 700; font-size: 15px; }
        .order-meta { font-size: 12px; color: #8e8e93; margin-bottom: 8px; }
        .status-chip { display: inline-block; padding: 3px 10px; border-radius: 12px; font-size: 11px; font-weight: 700; text-transform: uppercase; }
        .action-row { display: flex; gap: 8px; margin-top: 10px; }
        .action-row button { flex: 1; padding: 10px; border-radius: 12px; font-size: 13px; font-weight: 700; cursor: pointer; border: none; min-height: 44px; }
        .btn-track { background: var(--primary-yellow); color: #1e1e1e; }
        .btn-edit { background: #fef3e2; color: #b8860b; }
        .btn-again { background: #e8f5e9; color: #2e7d32; }
        .empty-state { text-align: center; padding: 60px 20px; color: #8e8e93; }
        .empty-state i { font-size: 48px; margin-bottom: 12px; color: #ccc; }
        .empty-state p { font-size: 16px; font-weight: 600; margin-bottom: 8px; }
        .empty-state button { margin-top: 12px; padding: 14px 28px; border-radius: 14px; border: none; background: var(--primary-yellow); color: #1e1e1e; font-weight: 700; font-size: 15px; cursor: pointer; min-height: 44px; }
        .refresh-btn {
            background: none; border: 1px solid var(--border-color); padding: 10px 20px;
            border-radius: 12px; cursor: pointer; font-size: 13px; color: #666; min-height: 44px;
            display: flex; align-items: center; gap: 6px; margin: 0 auto 16px;
        }
        @media (max-width: 576px) {
            body { padding-top: 80px; }
            header { padding: 12px 16px; }
            header h1 { font-size: 17px; }
            .brand-logo { height: 34px; }
            #orderAgainTopBtn { padding: 8px 10px; font-size: 12px; }
            .back-nav-trigger { width: 42px; height: 42px; }
            .cart-nav-trigger { width: 42px; height: 42px; }
            .page { padding: 0 12px; }
        }
    </style>
</head>
<body>
    <header>
        <button class="back-nav-trigger" onclick="history.length>1?history.back():location.href='customer.html'" aria-label="Back">
            <i class="fa-solid fa-arrow-left"></i>
        </button>
        <img src="../images/Logo.png" alt="House of Fries" class="brand-logo">
        <button class="btn-hof primary" id="orderAgainTopBtn" onclick="handleOrderAgain()" style="background:#FFB800;color:#1e1e1e;border:none;padding:8px 16px;border-radius:12px;font-weight:700;font-size:13px;cursor:pointer;min-height:44px;">
            <i class="fa-solid fa-plus"></i> Order Again
        </button>
        <div style="display:flex;align-items:center;gap:8px;flex-shrink:0;">
            <div id="hofCustomerAccountChip"></div>
            <button class="cart-nav-trigger" id="cartTrigger" aria-label="View Shopping Cart" onclick="window.location.href='cart.html'">
                <i class="fa-solid fa-cart-shopping"></i>
                <div class="nav-badge" id="cartBadgeCount">0</div>
            </button>
            <button class="cart-nav-trigger" id="myOrdersBtn" aria-label="My Orders">
                <i class="fa-solid fa-receipt"></i>
                <div class="nav-badge" id="myOrdersBadge" style="display:none;">0</div>
            </button>
        </div>
    </header>

    <div class="page" id="historyPage">
        <div class="section-title" style="margin-top:16px;">Order History</div>
        <div class="filter-row" id="filterRow"></div>
        <button class="refresh-btn" onclick="loadHistory()"><i class="fa-solid fa-rotate"></i> Refresh</button>
        <div id="ordersContainer"></div>
    </div>

    <script src="device.js"></script>
    <script src="account.js"></script>
    <script src="my_orders.js"></script>
    <script src="https://js.pusher.com/8.0/pusher.min.js"></script>
    <script src="orderHistory.js"></script>
</body>
</html>
