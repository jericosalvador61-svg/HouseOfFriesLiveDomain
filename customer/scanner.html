<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HOF | Scan Table QR</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Include SweetAlert2 for premium popup modals -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="/javascript/loading.js"></script>
    <style>
        body {
            background-color: #1e1e1e;
            /* Switched to match your dark/premium design theme */
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .scanner-container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        /* Professional QR Reader Styling */
        #reader {
            width: 100%;
            max-width: 450px;
            border-radius: 20px;
            overflow: hidden;
            border: 4px solid #fac12b !important;
            /* House of Fries brand Accent yellow */
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        /* Style the scan button inside the library */
        #reader__dashboard_section_csr button {
            background-color: #fac12b !important;
            color: #1e1e1e !important;
            border: none !important;
            padding: 8px 20px !important;
            border-radius: 5px !important;
            font-weight: bold !important;
            margin: 10px 0 !important;
        }

        .brand-logo {
            width: 90px;
            margin-bottom: 15px;
            filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.3));
        }

        .status-msg {
            font-size: 0.9rem;
            margin-top: 10px;
            color: #b0b0b0;
        }
    </style>
</head>

<body>

    <div class="container scanner-container px-4 text-center">
        <img src="../images/Logo.png" alt="House of Fries" class="brand-logo">
        <h2 class="fw-bold mb-1 text-uppercase" style="letter-spacing: 1px;">Scan Your Table</h2>
        <p class="status-msg mb-4">Please point your camera at the QR code displayed on your table surface.</p>

        <div id="reader"></div>

        <div id="result" class="mt-4 d-none">
            <div class="spinner-border text-warning" role="status" style="width: 3rem; height: 3rem;"></div>
            <h4 class="mt-3 fw-bold">Verifying Table Availability...</h4>
            <p class="text-muted">Please hold on tight.</p>
        </div>
    </div>

    <script src="https://unpkg.com/html5-qrcode"></script>

    <script>
        async function onScanSuccess(decodedText, decodedResult) {
            console.log("Scan Result Text:", decodedText);

            if (decodedText.includes('customer.html')) {
                const urlParams = new URLSearchParams(decodedText.substring(decodedText.indexOf('?')));
                const tableId = urlParams.get('table_id') || '';

                try {
                    await html5QrcodeScanner.clear();
                } catch (err) {
                    console.error("Scanner clear stall:", err);
                }

                const currentBase = window.location.origin;
                window.location.href = `${currentBase}/customer/customer.html?table_id=${encodeURIComponent(tableId)}`;

            } else {
                Swal.fire({
                    title: 'Invalid QR Code',
                    text: `This QR code ("${decodedText}") is not recognized by House of Fries systems.`,
                    icon: 'error',
                    confirmButtonColor: '#fac12b',
                    background: '#1e1e1e',
                    color: '#ffffff'
                });
            }
        }

        function onScanFailure(error) {
            // Failure occurs while lens focuses; left blank intentionally
        }

        let html5QrcodeScanner = new Html5QrcodeScanner(
            "reader",
            {
                fps: 20,
                qrbox: { width: 280, height: 280 },
                videoConstraints: {
                    width: { min: 640, ideal: 1280, max: 1920 },
                    height: { min: 480, ideal: 720, max: 1080 },
                    facingMode: "environment",
                    focusMode: "continuous"
                }
            },
            false
        );

        html5QrcodeScanner.render(onScanSuccess, onScanFailure);

    </script>
</body>

</html>
